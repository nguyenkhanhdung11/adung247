<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>FPS ARENA 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }
  canvas { display: block; }

  /* TÂM MÀN HÌNH */
  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px; pointer-events: none; z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #00ffff; box-shadow: 0 0 8px #00ffff;
  }
  #crosshair::before { width: 2px; height: 12px; left: 9px; top: 4px; }
  #crosshair::after { width: 12px; height: 2px; top: 9px; left: 4px; }

  /* UI */
  #hud { position: fixed; bottom: 30px; left: 30px; color: #fff; z-index: 10; }
  #hpBar { width: 250px; height: 18px; background: rgba(0,0,0,0.8); border: 2px solid #00ffff; border-radius: 4px; overflow: hidden; transform: skewX(-10deg); }
  #hpFill { height: 100%; width: 100%; background: linear-gradient(90deg, #00ffff, #0055ff); transition: width 0.2s; }
  #hpText { font-size: 16px; margin-top: 8px; color: #00ffff; font-weight: bold; }
  
  #weaponBox { position: fixed; bottom: 30px; right: 30px; color: #fff; z-index: 10; text-align: right; }
  #weaponName { font-size: 24px; font-weight: 900; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
  #ammo { font-size: 48px; font-weight: 900; color: #fff; }
  
  #weaponList { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; }
  .wSlot { padding: 8px 20px; background: rgba(0,0,0,0.8); border: 2px solid #333; border-radius: 4px; color: #888; font-weight: bold; transition: all 0.2s; transform: skewX(-10deg); }
  .wSlot.active { border-color: #ff00ff; color: #fff; box-shadow: 0 0 15px rgba(255,0,255,0.5); }
  
  #scoreboard { position: fixed; top: 30px; right: 30px; background: rgba(0,0,0,0.7); padding: 15px 25px; border-left: 4px solid #00ffff; color: #fff; border-radius: 4px; }
  
  #killFeed { position: fixed; top: 30px; left: 30px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
  .killMsg { background: rgba(0,0,0,0.8); padding: 8px 16px; border-left: 3px solid #ff0055; color: #fff; animation: slideIn 0.3s; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
  
  #damageOverlay { position: fixed; inset: 0; pointer-events: none; z-index: 9; background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.5) 100%); opacity: 0; transition: opacity 0.2s; }
  #hitmarker { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #ff00ff; font-size: 32px; font-weight: bold; opacity: 0; transition: opacity 0.1s; }
  
  #startScreen { position: fixed; inset: 0; background: #050510; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #fff; }
  #startScreen h1 { font-size: 60px; color: #00ffff; text-shadow: 0 0 20px #00ffff; margin-bottom: 20px; }
  #startBtn { padding: 20px 60px; font-size: 20px; font-weight: bold; background: transparent; color: #00ffff; border: 3px solid #00ffff; cursor: pointer; transition: 0.3s; }
  #startBtn:hover { background: #00ffff; color: #000; }
</style>
</head>
<body>

<div id="startScreen">
  <h1>FPS ARENA 3D</h1>
  <p style="margin-bottom: 30px; color:#aaa;">WASD: Đi | Space: Nhảy | Shift: Chạy nhanh | 1,2,3: Đổi súng | R: Nạp đạn</p>
  <button id="startBtn">VÀO GAME</button>
</div>

<div id="crosshair"></div>
<div id="damageOverlay"></div>
<div id="hitmarker">✕</div>

<div id="hud">
  <div id="hpBar"><div id="hpFill"></div></div>
  <div id="hpText">HP: 100 / 100</div>
</div>

<div id="weaponBox">
  <div id="weaponName">AK-47</div>
  <div id="ammo">30 / 30</div>
</div>

<div id="weaponList">
  <div class="wSlot active" data-slot="ak47">1 • AK-47</div>
  <div class="wSlot" data-slot="knife">2 • DAO</div>
  <div class="wSlot" data-slot="pistol">3 • LỤC</div>
</div>

<div id="scoreboard">
  <div style="color:#00ffff; margin-bottom:10px; font-weight:bold;">BẢNG ĐIỂM</div>
  <div style="display:flex; justify-content:space-between; width:150px;"><span>Kills</span><span id="kills" style="color:#00ffff; font-weight:bold;">0</span></div>
  <div style="display:flex; justify-content:space-between; width:150px;"><span>Deaths</span><span id="deaths" style="color:#ff0055; font-weight:bold;">0</span></div>
</div>

<div id="killFeed"></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ==========================================
// 1. KHỞI TẠO HỆ THỐNG 3D
// ==========================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.FogExp2(0x050510, 0.03);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 300);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Cảnh riêng cho Súng
const gunScene = new THREE.Scene();
const gunCamera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 10);

// ==========================================
// 2. TẠO MAP & ÁNH SÁNG
// ==========================================
scene.add(new THREE.AmbientLight(0x334466, 2));
const dirLight = new THREE.DirectionalLight(0x00ffff, 1.5);
dirLight.position.set(20, 40, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
scene.add(dirLight);

const neonPink = new THREE.PointLight(0xff00ff, 5, 40); neonPink.position.set(-15, 5, -15); scene.add(neonPink);
const neonBlue = new THREE.PointLight(0x00ffff, 5, 40); neonBlue.position.set(15, 5, 15); scene.add(neonBlue);

// Sàn
const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x0a0a15, roughness: 0.2, metalness: 0.8 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
scene.add(new THREE.GridHelper(100, 50, 0x00ffff, 0x110022));

// Vật cản
const obstacles = [];
function addBox(x, z, w, h, d, color) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.7, emissive: color, emissiveIntensity: 0.2 }));
  mesh.position.set(x, h/2, z); mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  obstacles.push({ x, z, w, d });
}
addBox(-12, -12, 4, 8, 4, 0x1a0033); addBox(12, 12, 6, 10, 6, 0x001a33);
addBox(-12, 15, 5, 6, 5, 0x33001a); addBox(18, -10, 8, 4, 8, 0x00331a);
addBox(0, 0, 3, 15, 3, 0x00ffff); addBox(-25, 0, 4, 8, 10, 0xff00ff);
addBox(25, 0, 4, 8, 10, 0x00ffff); addBox(0, -25, 12, 5, 4, 0x00ff88);
addBox(0, 25, 12, 5, 4, 0xff0055);

// ==========================================
// 3. TẠO SÚNG
// ==========================================
const gunGroup = new THREE.Group();
gunScene.add(gunGroup);
const muzzleFlash = new THREE.PointLight(0x00ffff, 0, 5);
muzzleFlash.position.set(0.25, -0.18, -1); gunGroup.add(muzzleFlash);

function createAK() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9 });
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.7), mat)).position.set(0.25, -0.22, -0.5);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8), mat); barrel.rotation.x = Math.PI/2; barrel.position.set(0.25, -0.18, -0.95); g.add(barrel);
  return g;
}
function createPistol() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.12, 0.35), mat)).position.set(0.25, -0.22, -0.4);
  return g;
}
function createKnife() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 1 });
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.06, 0.4), mat)).position.set(0.28, -0.25, -0.55);
  return g;
}
const akModel = createAK(), pistolModel = createPistol(), knifeModel = createKnife();
pistolModel.visible = false; knifeModel.visible = false;
gunGroup.add(akModel, pistolModel, knifeModel);

// ==========================================
// 4. TRẠNG THÁI NGƯỜI CHƠI
// ==========================================
const player = { x: 0, y: 1.7, z: 0, rx: 0, ry: 0, vy: 0, onGround: true, hp: 100, weapon: 'ak47', prevWeapon: 'ak47', kills: 0, deaths: 0, equipTimer: 0, lastShot: 0 };
const weapons = { ak47: { name: 'AK-47', maxAmmo: 30, fireRate: 100, spread: 0.02 }, knife: { name: 'DAO', maxAmmo: Infinity, fireRate: 350, spread: 0 }, pistol: { name: 'LỤC', maxAmmo: 12, fireRate: 180, spread: 0.01 } };
let ammo = { ak47: 30, pistol: 12 };
const keys = {}; let mouseLocked = false;

function checkCollision(nx, nz) {
  const r = 0.4;
  for (const o of obstacles) { if (Math.abs(nx - o.x) < o.w/2 + r && Math.abs(nz - o.z) < o.d/2 + r) return true; }
  return Math.abs(nx) > 49 || Math.abs(nz) > 49;
}

// ==========================================
// 5. SOCKET & ÂM THANH
// ==========================================
let socket; const otherPlayers = {};
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, dur, type, vol) {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.2, audioCtx.currentTime + dur);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + dur);
}
const sfx = { shoot: () => playSound(150, 0.15, 'sawtooth', 0.15), hit: () => playSound(1000, 0.05, 'sine', 0.1) };

function connect() {
  socket = io();
  socket.on('init', ({ self, players }) => {
    player.x = self.x; player.z = self.z;
    Object.values(players).forEach(p => { if (p.id !== socket.id) addOtherPlayer(p); });
  });
  socket.on('playerJoined', addOtherPlayer);
  socket.on('playerMoved', (p) => {
    if (otherPlayers[p.id]) {
      otherPlayers[p.id].position.set(p.x, 0, p.z);
      otherPlayers[p.id].rotation.y = p.ry;
    }
  });
  socket.on('playerLeft', (id) => { if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; } });
  socket.on('damaged', ({ hp }) => {
    player.hp = hp; document.getElementById('hpFill').style.width = hp + '%';
    document.getElementById('hpText').textContent = `HP: ${hp} / 100`;
    document.getElementById('damageOverlay').style.opacity = '1'; setTimeout(() => document.getElementById('damageOverlay').style.opacity = '0', 200);
  });
  socket.on('respawn', ({ hp, x, z, kills, deaths }) => {
    player.hp = hp; player.x = x; player.z = z; player.kills = kills; player.deaths = deaths;
    document.getElementById('hpFill').style.width = hp + '%'; document.getElementById('kills').textContent = kills; document.getElementById('deaths').textContent = deaths;
  });
}

function addOtherPlayer(p) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.9, 4, 8), new THREE.MeshStandardMaterial({ color: p.color, emissive: p.color, emissiveIntensity: 0.4 }));
  body.position.y = 0.9; body.castShadow = true; group.add(body);
  group.position.set(p.x, 0, p.z);
  scene.add(group);
  otherPlayers[p.id] = group;
}

// ==========================================
// 6. ĐIỀU KHIỂN (ĐÃ FIX LỖI KẸT)
// ==========================================
// Bổ sung sự kiện click vào màn hình để tự động khóa chuột nếu chưa khóa
document.addEventListener('click', () => {
  if (!mouseLocked && document.getElementById('startScreen').style.display === 'none') {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') e.preventDefault();
  keys[e.code] = true;
  
  // Nếu chuột chưa khóa thì không xử lý phím bắn/đổi súng
  if (!mouseLocked) return;
  
  if (e.code === 'Digit1') switchWeapon('ak47');
  if (e.code === 'Digit2') switchWeapon('knife');
  if (e.code === 'Digit3') switchWeapon('pistol');
  if (e.code === 'KeyQ') {
    switchWeapon(player.prevWeapon === player.weapon ? (player.weapon === 'ak47' ? 'pistol' : 'ak47') : player.prevWeapon);
  }
  if (e.code === 'KeyR') reload();
});
document.addEventListener('keyup', (e) => keys[e.code] = false);

document.addEventListener('mousemove', (e) => {
  if (!mouseLocked) return;
  player.ry -= e.movementX * 0.002;
  player.rx -= e.movementY * 0.002;
  player.rx = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.rx));
});
document.addEventListener('mousedown', (e) => { if (mouseLocked && e.button === 0) tryShoot(); });
document.addEventListener('pointerlockchange', () => { mouseLocked = document.pointerLockElement !== null; });

function switchWeapon(w) {
  if (player.weapon === w) return;
  player.prevWeapon = player.weapon; player.weapon = w;
  gunGroup.position.y = -0.5; player.equipTimer = 0.2;
  akModel.visible = w === 'ak47'; pistolModel.visible = w === 'pistol'; knifeModel.visible = w === 'knife';
  document.querySelectorAll('.wSlot').forEach(el => el.classList.toggle('active', el.dataset.slot === w));
  document.getElementById('weaponName').textContent = weapons[w].name;
  document.getElementById('ammo').textContent = weapons[w].maxAmmo === Infinity ? '∞' : `${ammo[w]} / ${weapons[w].maxAmmo}`;
}

function reload() {
  const w = weapons[player.weapon];
  if (w.maxAmmo === Infinity || ammo[player.weapon] >= w.maxAmmo) return;
  playSound(400, 0.2, 'square', 0.05);
  setTimeout(() => {
    ammo[player.weapon] = w.maxAmmo;
    document.getElementById('ammo').textContent = `${ammo[player.weapon]} / ${w.maxAmmo}`;
  }, 1500);
}

function tryShoot() {
  const w = weapons[player.weapon];
  if (performance.now() - player.lastShot < w.fireRate) return;
  player.lastShot = performance.now();

  if (player.weapon !== 'knife') {
    if (ammo[player.weapon] <= 0) { reload(); return; }
    ammo[player.weapon]--; document.getElementById('ammo').textContent = `${ammo[player.weapon]} / ${w.maxAmmo}`;
    sfx.shoot(); muzzleFlash.intensity = 5; setTimeout(() => muzzleFlash.intensity = 0, 50);
    gunGroup.position.z = 0.1; player.rx += 0.02 + Math.random() * w.spread;
  } else {
    playSound(600, 0.1, 'triangle', 0.1);
  }

  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const origin = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
  
  socket.emit('shoot', { weapon: player.weapon, origin, dir: { x: dir.x, y: dir.y, z: dir.z } });

  if (player.weapon !== 'knife') {
    const end = new THREE.Vector3().copy(new THREE.Vector3(origin.x, origin.y, origin.z)).addScaledVector(dir, 100);
    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(origin.x, origin.y, origin.z), end]);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 1 }));
    scene.add(line);
    setTimeout(() => scene.remove(line), 100);
  }
}

// ==========================================
// 7. GAME LOOP
// ==========================================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  let isMoving = false;

  // CHỈ DI CHUYỂN KHI ĐÃ KHÓA CHUỘT (CLICK VÀO GAME)
  if (mouseLocked) {
    let speed = 8 * (keys['ShiftLeft'] ? 1.6 : 1) * dt;

    let dx = 0, dz = 0;
    if (keys['KeyW']) { dx -= Math.sin(player.ry); dz -= Math.cos(player.ry); }
    if (keys['KeyS']) { dx += Math.sin(player.ry); dz += Math.cos(player.ry); }
    if (keys['KeyA']) { dx -= Math.cos(player.ry); dz += Math.sin(player.ry); }
    if (keys['KeyD']) { dx += Math.cos(player.ry); dz -= Math.sin(player.ry); }

    const len = Math.sqrt(dx*dx + dz*dz);
    if (len > 0) { dx /= len; dz /= len; isMoving = true; }

    const nx = player.x + dx * speed;
    const nz = player.z + dz * speed;
    if (!checkCollision(nx, player.z)) player.x = nx;
    if (!checkCollision(player.x, nz)) player.z = nz;

    if (keys['Space'] && player.onGround) { player.vy = 8; player.onGround = false; }
    player.vy -= 25 * dt; player.y += player.vy * dt;
    
    if (player.y <= 1.7) { player.y = 1.7; player.vy = 0; player.onGround = true; }
  }

  camera.position.set(player.x, player.y, player.z);
  camera.rotation.y = player.ry;
  camera.rotation.x = player.rx;

  if (player.equipTimer > 0) {
    player.equipTimer -= dt;
    gunGroup.position.y = THREE.MathUtils.lerp(gunGroup.position.y, 0, 15 * dt);
  } else {
    const bobY = Math.sin(performance.now() * 0.01) * (isMoving ? 0.02 : 0);
    const bobX = Math.cos(performance.now() * 0.005) * (isMoving ? 0.01 : 0);
    gunGroup.position.set(bobX, bobY, 0);
    gunGroup.position.z = THREE.MathUtils.lerp(gunGroup.position.z, 0, 15 * dt);
  }

  if (socket && socket.connected) {
    socket.emit('move', { x: player.x, y: player.y, z: player.z, rx: player.rx, ry: player.ry, weapon: player.weapon });
  }

  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.clearDepth();
  renderer.render(gunScene, gunCamera);
  renderer.autoClear = true;
}

// ==========================================
// 8. BẮT ĐẦU GAME
// ==========================================
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  gunCamera.aspect = innerWidth / innerHeight; gunCamera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startScreen').style.display = 'none';
  if(audioCtx.state === 'suspended') audioCtx.resume();
  renderer.domElement.requestPointerLock(); 
  connect(); 
  animate();
});
</script>
</body>
</html>
